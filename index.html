<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro AI Camera + LUT & Manual Controls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0d0d0d; color: #fff; display: flex; flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;
    }

    /* Header Info */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      padding: 8px 12px; background: rgba(0, 0, 0, 0.85); font-size: 11px; z-index: 10;
      border-bottom: 1px solid #222; flex-shrink: 0;
    }
    .badge { background: #1e1e1e; padding: 4px 8px; border-radius: 6px; border: 1px solid #333; white-space: nowrap; }
    .ai-status { color: #00e676; font-weight: 600; font-size: 11px; text-align: center; }

    /* Viewport Kamera */
    .camera-container {
      position: relative; flex: 1; min-height: 0; background: #050505; display: flex;
      flex-direction: column; justify-content: center; align-items: center; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.2s ease; }

    /* Grid Rule of Thirds */
    .grid-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.2) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
    }
    .grid-overlay.hidden { display: none; }

    .start-box {
      position: absolute; z-index: 5; display: flex; flex-direction: column;
      align-items: center; gap: 10px; padding: 20px; text-align: center; max-width: 90%;
    }
    .start-btn {
      background: #ff9100; color: #000; border: none; padding: 14px 24px;
      border-radius: 30px; font-weight: bold; font-size: 15px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,145,0,0.4);
    }
    .error-msg { color: #ff5252; font-size: 12px; margin-top: 6px; line-height: 1.4; }

    /* Panel Kontrol Bawah */
    .controls-wrapper {
      background: #141414; padding: 8px 12px 14px; border-top: 1px solid #262626;
      z-index: 10; flex-shrink: 0;
    }
    .lut-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; font-size: 11px; color: #bbb;
    }
    .lut-actions { display: flex; gap: 6px; }
    .mini-btn {
      background: #252525; color: #ff9100; border: 1px solid #3a3a3a;
      padding: 3px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;
    }

    /* Preset LUT */
    .lut-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .lut-scroll::-webkit-scrollbar { display: none; }
    .lut-btn {
      background: #222; color: #ddd; border: 1px solid #333; padding: 5px 11px;
      border-radius: 20px; font-size: 11px; white-space: nowrap; cursor: pointer;
    }
    .lut-btn.active { background: #ff9100; color: #000; border-color: #ff9100; font-weight: bold; }

    /* Panel Kamera Manual Pro */
    .manual-panel {
      background: #1c1c1c; border-radius: 10px; padding: 7px 10px; margin-bottom: 10px;
      border: 1px solid #2c2c2c;
    }
    .manual-tabs { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 6px; }
    .m-tab {
      flex: 1; background: #262626; border: none; color: #aaa; padding: 5px 2px;
      border-radius: 6px; font-size: 10px; cursor: pointer; text-align: center;
    }
    .m-tab.active { background: #383838; color: #ff9100; font-weight: bold; border: 1px solid #ff9100; }
    .slider-box { display: flex; align-items: center; gap: 8px; }
    .slider-box input[type="range"] { flex: 1; accent-color: #ff9100; }
    .slider-val { font-size: 11px; width: 52px; text-align: right; color: #ff9100; font-family: monospace; }

    /* Baris Aksi Utama (Lihat Foto, Shutter, Flip) */
    .shutter-row { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
    .gallery-preview {
      width: 48px; height: 48px; border-radius: 10px; background: #262626;
      border: 2px solid #444; overflow: hidden; cursor: pointer; position: relative;
      display: flex; justify-content: center; align-items: center; font-size: 10px; color: #888;
    }
    .gallery-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-count {
      position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.8);
      color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 4px;
    }
    .shutter-btn {
      width: 58px; height: 58px; border-radius: 50%; background: #fff;
      border: 4px solid #555; cursor: pointer; transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.92); background: #ff9100; }
    .side-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: #262626; border: 1px solid #333; color: #fff; padding: 7px 9px;
      border-radius: 8px; font-size: 11px; cursor: pointer;
    }
    .icon-btn.active { border-color: #00e676; color: #00e676; }

    /* Modal Galeri Lihat Foto */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 50; flex-direction: column; padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .modal-body img { max-width: 100%; max-height: 60vh; border-radius: 8px; border: 1px solid #333; }
    .thumb-strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; width: 100%; margin-top: 10px; }
    .thumb-strip img {
      width: 56px; height: 56px; object-fit: cover; border-radius: 6px;
      border: 2px solid transparent; cursor: pointer; opacity: 0.6;
    }
    .thumb-strip img.selected { border-color: #ff9100; opacity: 1; }
    .modal-actions { display: flex; gap: 12px; margin-top: 10px; }
    .btn-download { background: #00e676; color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-delete { background: #ff5252; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Top Info -->
  <div class="top-bar">
    <span class="badge" id="resInfo">RES: -- | FPS: --</span>
    <span class="ai-status" id="aiStatus">AI: Menunggu Kamera</span>
    <div style="display:flex; gap:4px;">
      <button class="icon-btn active" id="gridBtn">Grid: ON</button>
      <button class="icon-btn" id="torchBtn">Torch: OFF</button>
    </div>
  </div>

  <!-- Camera Viewport -->
  <div class="camera-container">
    <div class="start-box" id="startBox">
      <button class="start-btn" id="startCamBtn">📷 Ketuk untuk Aktifkan Kamera</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <div class="grid-overlay" id="gridOverlay"></div>
  </div>

  <!-- Controls -->
  <div class="controls-wrapper">
    <!-- Baris Status LUT, Salin Preset & AI Auto-LUT -->
    <div class="lut-header">
      <span>LUT: <strong id="activeLutName" style="color:#fff;">ASLI</strong></span>
      <div class="lut-actions">
        <button class="mini-btn" id="aiAutoLutBtn">✨ AI Auto-LUT</button>
        <button class="mini-btn" id="copyPresetBtn">📋 Salin Preset</button>
        <label class="mini-btn" for="cubeInput" style="cursor:pointer;">+ Import .CUBE</label>
        <input type="file" id="cubeInput" accept=".cube" style="display:none;" />
      </div>
    </div>

    <!-- Pilihan LUT -->
    <div class="lut-scroll" id="lutList">
      <button class="lut-btn active" data-name="ASLI" data-filter="none">Asli</button>
      <button class="lut-btn" data-name="Canon G7X" data-filter="contrast(1.15) saturate(1.25) brightness(1.05)">Canon G7X</button>
      <button class="lut-btn" data-name="iPhone 14" data-filter="contrast(1.08) saturate(1.12) sepia(0.08)">iPhone 14</button>
      <button class="lut-btn" data-name="Warm Vintage" data-filter="sepia(0.35) contrast(1.1) brightness(0.95)">Warm Vintage</button>
      <button class="lut-btn" data-name="Teal & Orange" data-filter="contrast(1.25) saturate(1.3) hue-rotate(-12deg)">Teal & Orange</button>
      <button class="lut-btn" data-name="Cyberpunk" data-filter="contrast(1.4) saturate(1.6) hue-rotate(25deg)">Cyberpunk</button>
      <button class="lut-btn" data-name="B&W Noir" data-filter="grayscale(1) contrast(1.35)">B&W Noir</button>
    </div>

    <!-- Panel Kontrol Manual Pro -->
    <div class="manual-panel">
      <div class="manual-tabs">
        <button class="m-tab active" data-param="ev">EV<br><span id="lbl-ev">0.0</span></button>
        <button class="m-tab" data-param="iso">ISO<br><span id="lbl-iso">AUTO</span></button>
        <button class="m-tab" data-param="shutter">SHUTTER<br><span id="lbl-shutter">1/60</span></button>
        <button class="m-tab" data-param="wb">WB<br><span id="lbl-wb">5500K</span></button>
        <button class="m-tab" data-param="zoom">ZOOM<br><span id="lbl-zoom">1.0x</span></button>
      </div>
      <div class="slider-box">
        <input type="range" id="manualSlider" min="-2" max="2" step="0.1" value="0" />
        <span class="slider-val" id="sliderValueText">0.0 EV</span>
      </div>
    </div>

    <!-- Baris Shutter & Kolom Lihat Foto -->
    <div class="shutter-row">
      <!-- Kolom Lihat Foto -->
      <div class="gallery-preview" id="openGalleryBtn" title="Lihat Foto">
        <span id="emptyGalleryText">Foto</span>
        <img id="lastPhotoThumb" style="display:none;" alt="Preview" />
        <span class="photo-count" id="photoCount" style="display:none;">0</span>
      </div>

      <!-- Tombol Jepret -->
      <button class="shutter-btn" id="captureBtn" title="Ambil Foto"></button>

      <!-- Flip Cam & Reset Manual -->
      <div class="side-actions">
        <button class="icon-btn" id="resetManualBtn">Reset</button>
        <button class="icon-btn" id="flipCamBtn">Flip Cam</button>
      </div>
    </div>
  </div>

  <!-- Modal Galeri Lihat Foto -->
  <div class="modal" id="galleryModal">
    <div class="modal-header">
      <h3>Galeri Foto (<span id="modalPhotoIndex">0/0</span>)</h3>
      <button class="icon-btn" id="closeGalleryBtn">✕ Tutup</button>
    </div>
    <div class="modal-body">
      <img id="modalMainImage" src="" alt="Hasil Foto" />
      <div class="modal-actions">
        <button class="btn-download" id="downloadPhotoBtn">⬇ Simpan Foto</button>
        <button class="btn-delete" id="deletePhotoBtn">🗑 Hapus</button>
      </div>
      <div class="thumb-strip" id="thumbStrip"></div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBox = document.getElementById('startBox');
    const startCamBtn = document.getElementById('startCamBtn');
    const errorMsg = document.getElementById('errorMsg');
    const captureBtn = document.getElementById('captureBtn');
    const flipCamBtn = document.getElementById('flipCamBtn');
    const torchBtn = document.getElementById('torchBtn');
    const gridBtn = document.getElementById('gridBtn');
    const gridOverlay = document.getElementById('gridOverlay');
    const resInfo = document.getElementById('resInfo');
    const aiStatus = document.getElementById('aiStatus');
    const activeLutName = document.getElementById('activeLutName');

    let stream = null;
    let useFrontCam = false;
    let torchOn = false;
    let currentLutFilter = 'none';

    const manualState = { ev: 0, iso: 100, shutter: 60, wb: 5500, zoom: 1.0 };
    let activeParam = 'ev';
    let capturedPhotos = [];
    let selectedPhotoIndex = 0;

    async function startCamera() {
      errorMsg.textContent = '';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        errorMsg.textContent = 'Browser tidak mendukung kamera. Pastikan menggunakan Chrome terbaru.';
        return;
      }

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      const facing = useFrontCam ? 'user' : 'environment';
      const constraintsList = [
        { video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
        { video: { facingMode: facing }, audio: false },
        { video: true, audio: false }
      ];

      let lastErr = null;
      for (const constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          break;
        } catch (err) {
          lastErr = err;
        }
      }

      if (!stream) {
        errorMsg.textContent = `Kamera gagal dibuka (${lastErr ? lastErr.name : 'Error'}). Aktifkan izin Kamera di Pengaturan HP > Aplikasi > Chrome.`;
        return;
      }

      video.srcObject = stream;
      try { await video.play(); } catch (e) {}

      startBox.style.display = 'none';
      const track = stream.getVideoTracks()[0];
      const settings = track && track.getSettings ? track.getSettings() : {};
      const w = settings.width || video.videoWidth || 1280;
      const h = settings.height || video.videoHeight || 720;
      const fps = settings.frameRate ? Math.round(settings.frameRate) : 30;
      resInfo.textContent = `RES: ${w}x${h} | FPS: ${fps}`;
      aiStatus.textContent = 'AI: Menganalisis Scene...';
      setTimeout(() => { aiStatus.textContent = 'AI: Scene Optimal'; }, 1500);
    }

    startCamBtn.addEventListener('click', startCamera);
    flipCamBtn.addEventListener('click', () => {
      useFrontCam = !useFrontCam;
      startCamera();
    });

    gridBtn.addEventListener('click', () => {
      gridOverlay.classList.toggle('hidden');
      const isOn = !gridOverlay.classList.contains('hidden');
      gridBtn.textContent = isOn ? 'Grid: ON' : 'Grid: OFF';
      gridBtn.classList.toggle('active', isOn);
    });

    torchBtn.addEventListener('click', async () => {
      if (!stream) return;
      const track = stream.getVideoTracks()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      if (caps.torch) {
        torchOn = !torchOn;
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        torchBtn.textContent = `Torch: ${torchOn ? 'ON' : 'OFF'}`;
        torchBtn.classList.toggle('active', torchOn);
      } else {
        alert('Perangkat ini tidak mendukung kontrol Torch lewat browser.');
      }
    });

    function applyCameraEffects() {
      const brightnessVal = 1 + (manualState.ev * 0.25) + ((manualState.iso - 100) / 6000);
      const wbWarmth = (manualState.wb - 5500) / 10000;
      const sepiaAmt = wbWarmth > 0 ? Math.min(wbWarmth, 0.4) : 0;
      const hueAmt = wbWarmth < 0 ? wbWarmth * 40 : 0;

      const manualFilter = `brightness(${brightnessVal.toFixed(2)}) sepia(${sepiaAmt.toFixed(2)}) hue-rotate(${hueAmt.toFixed(0)}deg)`;
      const combinedFilter = currentLutFilter === 'none' ? manualFilter : `${currentLutFilter} ${manualFilter}`;

      video.style.filter = combinedFilter;
      video.style.transform = `scale(${manualState.zoom})`;

      if (stream) {
        const track = stream.getVideoTracks()[0];
        const caps = track && track.getCapabilities ? track.getCapabilities() : {};
        const adv = {};
        if (caps.zoom) adv.zoom = Math.min(Math.max(manualState.zoom, caps.zoom.min), caps.zoom.max);
        if (caps.exposureCompensation) {
          adv.exposureCompensation = Math.min(Math.max(manualState.ev, caps.exposureCompensation.min), caps.exposureCompensation.max);
        }
        if (Object.keys(adv).length > 0) track.applyConstraints({ advanced: [adv] }).catch(() => {});
      }
    }

    function bindLutButtons() {
      document.querySelectorAll('.lut-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.lut-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLutFilter = btn.dataset.filter;
          activeLutName.textContent = btn.dataset.name;
          applyCameraEffects();
        };
      });
    }
    bindLutButtons();

    document.getElementById('cubeInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const lines = ev.target.result.split('\n');
        let rSum = 0, gSum = 0, bSum = 0, count = 0;
        for (const line of lines) {
          const parts = line.trim().split(/\s+/);
          if (parts.length === 3 && !isNaN(parts[0]) && !isNaN(parts[1]) && !isNaN(parts[2])) {
            rSum += parseFloat(parts[0]);
            gSum += parseFloat(parts[1]);
            bSum += parseFloat(parts[2]);
            count++;
          }
        }
        const avgR = count ? rSum / count : 0.5;
        const avgB = count ? bSum / count : 0.5;
        const warmth = Math.max(0, (avgR - avgB) * 0.6);
        const hue = (avgB - avgR) * 35;
        const customFilter = `contrast(1.18) saturate(1.22) sepia(${warmth.toFixed(2)}) hue-rotate(${hue.toFixed(0)}deg)`;
        const lutName = file.name.replace(/\.cube$/i, '').slice(0, 14);

        const newBtn = document.createElement('button');
        newBtn.className = 'lut-btn';
        newBtn.dataset.name = lutName;
        newBtn.dataset.filter = customFilter;
        newBtn.textContent = lutName;
        document.getElementById('lutList').appendChild(newBtn);
        bindLutButtons();
        newBtn.click();
      };
      reader.readAsText(file);
    });

    document.getElementById('aiAutoLutBtn').addEventListener('click', () => {
      aiStatus.textContent = 'AI: Menganalisis Scene...';
      setTimeout(() => {
        const btns = Array.from(document.querySelectorAll('.lut-btn')).slice(1);
        const pick = btns[Math.floor(Math.random() * btns.length)];
        pick.click();
        aiStatus.textContent = `AI: Rekomendasi ${pick.dataset.name}`;
      }, 600);
    });

    document.getElementById('copyPresetBtn').addEventListener('click', () => {
      const presetText = `Pro AI Camera Preset | LUT: ${activeLutName.textContent} | EV: ${manualState.ev} | ISO: ${manualState.iso} | Shutter: 1/${manualState.shutter} | WB: ${manualState.wb}K | Zoom: ${manualState.zoom}x`;
      navigator.clipboard.writeText(presetText).then(() => {
        alert('Preset disalin ke clipboard:\n' + presetText);
      });
    });

    const slider = document.getElementById('manualSlider');
    const sliderValueText = document.getElementById('sliderValueText');
    const paramConfigs = {
      ev:      { min: -2,   max: 2,    step: 0.1, format: v => `${v > 0 ? '+' : ''}${parseFloat(v).toFixed(1)} EV`, lbl: 'lbl-ev' },
      iso:     { min: 100,  max: 3200, step: 100, format: v => `${v}`, lbl: 'lbl-iso' },
      shutter: { min: 15,   max: 1000, step: 15,  format: v => `1/${v}s`, lbl: 'lbl-shutter' },
      wb:      { min: 2800, max: 8000, step: 100, format: v => `${v}K`, lbl: 'lbl-wb' },
      zoom:    { min: 1,    max: 4,    step: 0.1, format: v => `${parseFloat(v).toFixed(1)}x`, lbl: 'lbl-zoom' }
    };

    document.querySelectorAll('.m-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.m-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeParam = tab.dataset.param;
        const cfg = paramConfigs[activeParam];
        slider.min = cfg.min; slider.max = cfg.max; slider.step = cfg.step;
        slider.value = manualState[activeParam];
        sliderValueText.textContent = cfg.format(manualState[activeParam]);
      });
    });

    slider.addEventListener('input', () => {
      const val = parseFloat(slider.value);
      manualState[activeParam] = val;
      const cfg = paramConfigs[activeParam];
      const formatted = cfg.format(val);
      sliderValueText.textContent = formatted;
      document.getElementById(cfg.lbl).textContent = formatted.replace(' EV', '');
      applyCameraEffects();
    });

    document.getElementById('resetManualBtn').addEventListener('click', () => {
      manualState.ev = 0; manualState.iso = 100; manualState.shutter = 60; manualState.wb = 5500; manualState.zoom = 1.0;
      document.getElementById('lbl-ev').textContent = '0.0';
      document.getElementById('lbl-iso').textContent = 'AUTO';
      document.getElementById('lbl-shutter').textContent = '1/60';
      document.getElementById('lbl-wb').textContent = '5500K';
      document.getElementById('lbl-zoom').textContent = '1.0x';
      slider.value = manualState[activeParam];

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WinaCamera Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    html, body { background: #000; color: #fff; overflow: hidden; height: 100dvh; width: 100vw; display: flex; flex-direction: column; }
    
    #viewfinder { position: relative; flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.2s ease; }
    canvas { display: none; }

    #start-overlay {
      position: absolute; z-index: 30; background: rgba(0,0,0,0.88); inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 20px; text-align: center;
    }
    .start-cam-btn {
      background: #00a8ff; color: #fff; border: none; padding: 15px 26px;
      border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    #err-msg { color: #ff6b6b; font-size: 13px; max-width: 310px; line-height: 1.4; }

    .hud-top {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .hud-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .hud-badge {
      background: rgba(0, 0, 0, 0.7); padding: 6px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.25); font-size: 11px;
      display: flex; align-items: center; gap: 8px;
    }
    .copy-btn {
      background: #00a8ff; border: none; color: #fff; font-weight: bold;
      border-radius: 5px; padding: 4px 8px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    }
    .copy-btn svg { width: 13px; height: 13px; fill: currentColor; }
    .top-btn {
      background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer;
      font-size: 11px; font-weight: bold;
    }
    .top-btn.active { background: #00a8ff; border-color: #00a8ff; }

    .grid-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.25) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
    }

    .controls-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      background: linear-gradient(transparent, rgba(0,0,0,0.95));
      padding: 12px 15px 25px 15px; display: flex; flex-direction: column; gap: 12px;
    }
    .lut-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .lut-bar::-webkit-scrollbar { display: none; }
    .lut-btn {
      background: rgba(35,35,35,0.9); color: #fff; border: 1px solid #555;
      padding: 7px 13px; border-radius: 18px; font-size: 12px; white-space: nowrap; cursor: pointer;
    }
    .lut-btn.active { background: #00a8ff; border-color: #00a8ff; font-weight: bold; }

    .shutter-row { display: flex; justify-content: space-around; align-items: center; }
    .shutter-btn {
      width: 66px; height: 66px; border-radius: 50%; background: #fff;
      border: 4px solid #888; cursor: pointer;
    }
    .shutter-btn:active { transform: scale(0.92); }
    .side-btn {
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25); color: #fff;
      padding: 10px 14px; border-radius: 10px; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="grid-overlay" id="grid"></div>

    <div id="start-overlay">
      <button class="start-cam-btn" id="btn-start">Ketuk untuk Aktifkan Kamera</button>
      <div id="err-msg">Siap menyalakan kamera...</div>
    </div>

    <div class="hud-top">
      <div class="hud-row">
        <div class="hud-badge" id="cam-info">RES: HD | 60 FPS</div>
        <div style="display:flex; gap:6px;">
          <button class="top-btn" id="torch-btn">Torch: OFF</button>
          <button class="top-btn" id="flip-btn">Flip Cam</button>
        </div>
      </div>

      <div class="hud-row">
        <div class="hud-badge">
          <span id="lut-info">LUT: ASLI</span>
          <button class="copy-btn" id="copy-btn">
            <svg viewBox="0 0 24 24">
              <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
            <span id="copy-label">Salin Preset</span>
          </button>
        </div>
      </div>
    </div>

    <div class="controls-bottom">
      <div class="lut-bar" id="lut-bar">
        <button class="lut-btn active" data-name="ASLI" data-filter="none">Asli</button>
        <button class="lut-btn" data-name="CANON G7X" data-filter="contrast(1.08) saturate(1.22) sepia(0.16) brightness(1.05)">Canon G7X</button>
        <button class="lut-btn" data-name="IPHONE 14" data-filter="contrast(1.06) saturate(1.15) brightness(1.03)">iPhone 14</button>
        <button class="lut-btn" data-name="WARM VINTAGE" data-filter="contrast(1.12) saturate(1.18) sepia(0.28) brightness(1.02)">Warm Vintage</button>
        <button class="lut-btn" data-name="TEAL & ORANGE" data-filter="contrast(1.18) saturate(1.3) hue-rotate(-10deg)">Teal & Orange</button>
        <button class="lut-btn" data-name="CYBERPUNK" data-filter="contrast(1.25) saturate(1.5) hue-rotate(25deg)">Cyberpunk</button>
        <button class="lut-btn" data-name="B&W NOIR" data-filter="grayscale(1) contrast(1.35)">B&W Noir</button>
      </div>

      <div class="shutter-row">
        <button class="side-btn" id="grid-btn">Grid: ON</button>
        <button class="shutter-btn" id="shutter"></button>
        <button class="side-btn" id="mirror-btn">Mirror: OFF</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const errBox = document.getElementById('err-msg');
    let facingMode = 'environment';
    let currentStream = null;
    let torchOn = false;
    let currentFilter = 'none';
    let isMirrored = false;

    function openCam() {
      errBox.innerText = 'Menghubungkan ke kamera...';
      if (currentStream) {
        currentStream.getTracks().forEach(function(t) { t.stop(); });
      }
      torchOn = false;
      document.getElementById('torch-btn').innerText = 'Torch: OFF';
      document.getElementById('torch-btn').classList.remove('active');

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: facingMode },
        audio: false
      }).then(function(stream) {
        currentStream = stream;
        video.srcObject = stream;
        video.play();
        document.getElementById('start-overlay').style.display = 'none';
        video.onloadedmetadata = function() {
          document.getElementById('cam-info').innerText = 'RES: ' + video.videoWidth + 'x' + video.videoHeight + ' | LIVE';
        };
      }).catch(function(err) {
        errBox.innerText = 'Izin Ditolak / Error: ' + err.name + ' (' + err.message + ')';
      });
    }

    document.getElementById('btn-start').onclick = openCam;
    window.onload = openCam;

    document.getElementById('flip-btn').onclick = function() {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      isMirrored = (facingMode === 'user');
      video.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
      openCam();
    };

    document.getElementById('mirror-btn').onclick = function() {
      isMirrored = !isMirrored;
      video.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
      this.innerText = isMirrored ? 'Mirror: ON' : 'Mirror: OFF';
    };

    document.getElementById('torch-btn').onclick = function() {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks().at(0);
      if (!track || !track.getCapabilities || !track.getCapabilities().torch) {
        alert('Torch/Flash tidak didukung pada kamera ini.');
        return;
      }
      torchOn = !torchOn;
      track.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function() {
        const btn = document.getElementById('torch-btn');
        btn.innerText = torchOn ? 'Torch: ON' : 'Torch: OFF';
        btn.classList.toggle('active', torchOn);
      });
    };

    document.getElementById('copy-btn').onclick = function() {
      const info = document.getElementById('lut-info').innerText + ' | ' + document.getElementById('cam-info').innerText;
      const ta = document.createElement('textarea');
      ta.value = info;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const lbl = document.getElementById('copy-label');
      lbl.innerText = 'Tersalin!';
      setTimeout(function() { lbl.innerText = 'Salin Preset'; }, 1500);
    };

    document.querySelectorAll('.lut-btn').forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll('.lut-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        currentFilter = this.getAttribute('data-filter');
        video.style.filter = currentFilter;
        document.getElementById('lut-info').innerText = 'LUT: ' + this.getAttribute('data-name');
      };
    });

    document.getElementById('grid-btn').onclick = function() {
      const grid = document.getElementById('grid');
      const show = grid.style.display === 'none';
      grid.style.display = show ? 'block' : 'none';

  <script>
    var dir = 'environment';
    var stm = null;
    var lCss = '';
    var hdr = false;
    var mir = false;
    var fl = false;
    var tmr = 0;
    var rw = 1280;
    var rh = 720;

    function startCam() {
      var st = document.getElementById('st');
      st.innerText = 'Menghubungkan...';
      if (stm) {
        stm.getTracks().forEach(function(t) {
          t.stop();
        });
      }
      fl = false;
      document.getElementById('bfl').classList.remove('on');
      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: dir,
          width: { ideal: rw },
          height: { ideal: rh }
        },
        audio: false
      }).then(function(s) {
        stm = s;
        var v = document.getElementById('vid');
        v.srcObject = s;
        v.play();
        document.getElementById('overlay').style.display = 'none';
        v.onloadedmetadata = function() {
          var t = 'RES: ' + v.videoWidth + 'x' + v.videoHeight;
          document.getElementById('res').innerText = t;
        };
      }).catch(function(e) {
        st.innerText = 'Error: ' + e.name;
        alert('Gagal: ' + e.message);
      });
    }

    function setR(w, h, id) {
      rw = w;
      rh = h;
      document.getElementById('r720').classList.remove('on');
      document.getElementById('r1080').classList.remove('on');
      document.getElementById(id).classList.add('on');
      startCam();
    }

    function flipCam() {
      dir = (dir === 'environment') ? 'user' : 'environment';
      mir = (dir === 'user');
      var v = document.getElementById('vid');
      v.style.transform = mir ? 'scaleX(-1)' : 'scaleX(1)';
      var bm = document.getElementById('bmir');
      bm.innerText = mir ? 'Mirror: ON' : 'Mirror: OFF';
      startCam();
    }

    function tglFlash() {
      if (!stm) return;
      var tr = stm.getVideoTracks().at(0);
      if (!tr || !tr.getCapabilities || !tr.getCapabilities().torch) {
        alert('Flash tidak didukung kamera ini');
        return;
      }
      fl = !fl;
      tr.applyConstraints({
        advanced: [{ torch: fl }]
      }).then(function() {
        document.getElementById('bfl').classList.toggle('on', fl);
      });
    }

    function tglHDR() {
      hdr = !hdr;
      var b = document.getElementById('bhdr');
      b.innerText = hdr ? 'HDR: ON' : 'HDR: OFF';
      b.classList.toggle('on', hdr);
      updF();
    }

    function tglPnl(id) {
      var p1 = document.getElementById('ppro');
      var p2 = document.getElementById('pset');
      var tg = document.getElementById(id);
      var op = tg.style.display === 'flex';
      p1.style.display = 'none';
      p2.style.display = 'none';
      document.getElementById('bpro').classList.remove('on');
      document.getElementById('bset').classList.remove('on');
      if (!op) {
        tg.style.display = 'flex';
        var btnId = (id === 'ppro') ? 'bpro' : 'bset';
        document.getElementById(btnId).classList.add('on');
      }
    }

    function updF() {
      var e = document.getElementById('exp').value / 100;
      var c = document.getElementById('con').value / 100;
      var s = document.getElementById('sat').value / 100;
      var w = document.getElementById('wrm').value / 100;
      var h = hdr ? 'contrast(1.16) saturate(1.18) brightness(1.06) ' : '';
      var f = h + 'brightness(' + e + ') contrast(' + c + ') saturate(' + s + ') sepia(' + w + ') ' + lCss;
      var res = f.trim() || 'none';
      document.getElementById('vid').style.filter = res;
      return res;
    }

    function rstPro() {
      document.getElementById('exp').value = 100;
      document.getElementById('con').value = 100;
      document.getElementById('sat').value = 100;
      document.getElementById('wrm').value = 0;
      updF();
    }

    function setL(b, n, c) {
      document.querySelectorAll('.lbtn').forEach(function(x) {
        x.classList.remove('on');
      });
      if (b) b.classList.add('on');
      lCss = c;
      var lbl = 'LUT: ' + n + (hdr ? ' + HDR' : '');
      document.getElementById('ilut').innerText = lbl;
      updF();
    }

    function impL(i) {
      var f = i.files.item(0);
      if (!f) return;
      var nm = f.name.replace('.cube', '').toUpperCase();
      setL(null, nm, 'contrast(1.12) saturate(1.22) sepia(0.18)');
      alert('LUT aktif: ' + nm);
    }

    function tglGrd() {
      var g = document.getElementById('grid');
      var b = document.getElementById('bgrd');
      var sh = g.style.display === 'none';
      g.style.display = sh ? 'block' : 'none';
      b.innerText = sh ? 'Grid: ON' : 'Grid: OFF';
      b.classList.toggle('on', sh);
    }

    function tglMir() {
      mir = !mir;
      var b = document.getElementById('bmir');
      var v = document.getElementById('vid');
      v.style.transform = mir ? 'scaleX(-1)' : 'scaleX(1)';
      b.innerText = mir ? 'Mirror: ON' : 'Mirror: OFF';
      b.classList.toggle('on', mir);
    }

    function tglTmr() {
      tmr = (tmr === 0) ? 3 : (tmr === 3 ? 10 : 0);
      var b = document.getElementById('btmr');
      b.innerText = (tmr === 0) ? 'Timer: OFF' : 'Timer: ' + tmr + 's';
      b.classList.toggle('on', tmr > 0);
    }

    function copyP() {
      var t = document.getElementById('ilut').innerText;
      var a = document.createElement('textarea');
      a.value = t;
      document.body.appendChild(a);
      a.select();
      document.execCommand('copy');
      document.body.removeChild(a);
      alert('Tersalin: ' + t);
    }

    function snap() {
      if (tmr === 0) {
        shoot();
        return;
      }
      var s = tmr;
      var d = document.getElementById('tm');
      d.style.display = 'block';
      d.innerText = s;
      var iv = setInterval(function() {
        s--;
        if (s > 0) {
          d.innerText = s;
        } else {
          clearInterval(iv);
          d.style.display = 'none';
          shoot();
        }
      }, 1000);
    }

    function shoot() {
      var v = document.getElementById('vid');
      var c = document.getElementById('cvs');
      c.width = v.videoWidth || 1280;
      c.height = v.videoHeight || 720;
      var x = c.getContext('2d');
      x.save();
      x.filter = updF();
      if (mir) {
        x.translate(c.width, 0);
        x.scale(-1, 1);
      }
      x.drawImage(v, 0, 0, c.width, c.height);
      x.restore();
      var a = document.createElement('a');
      a.download = 'WinaCam_' + Date.now() + '.jpg';
      a.href = c.toDataURL('image/jpeg', 0.95);
      a.click();
    }
  </script>
</body>
</html>

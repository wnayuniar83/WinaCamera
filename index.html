<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro AI Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background: #0d0d0d; color: #fff; display: flex; flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      padding: 8px 12px; background: #000; font-size: 11px; border-bottom: 1px solid #222;
    }
    .badge { background: #1e1e1e; padding: 4px 8px; border-radius: 6px; border: 1px solid #333; }
    .ai-status { color: #00e676; font-weight: bold; }
    .camera-container {
      position: relative; flex: 1; min-height: 0; background: #050505;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .grid-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.2) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
    }
    .grid-overlay.hidden { display: none; }
    .start-box {
      position: absolute; z-index: 20; display: flex; flex-direction: column;
      align-items: center; gap: 10px; padding: 20px; text-align: center;
    }
    .start-btn {
      background: #ff9100; color: #000; border: none; padding: 14px 24px;
      border-radius: 30px; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .error-msg { color: #ff5252; font-size: 12px; max-width: 280px; }
    .controls-wrapper {
      background: #141414; padding: 8px 12px 14px; border-top: 1px solid #262626; z-index: 20;
    }
    .lut-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; font-size: 11px; color: #bbb;
    }
    .lut-actions { display: flex; gap: 6px; }
    .mini-btn {
      background: #252525; color: #ff9100; border: 1px solid #3a3a3a;
      padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;
    }
    .lut-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .lut-btn {
      background: #222; color: #ddd; border: 1px solid #333; padding: 5px 11px;
      border-radius: 20px; font-size: 11px; white-space: nowrap; cursor: pointer;
    }
    .lut-btn.active { background: #ff9100; color: #000; border-color: #ff9100; font-weight: bold; }
    .manual-panel {
      background: #1c1c1c; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px;
      border: 1px solid #2c2c2c;
    }
    .manual-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .m-tab {
      flex: 1; background: #262626; border: none; color: #aaa; padding: 5px 2px;
      border-radius: 6px; font-size: 10px; cursor: pointer; text-align: center;
    }
    .m-tab.active { background: #383838; color: #ff9100; font-weight: bold; border: 1px solid #ff9100; }
    .slider-box { display: flex; align-items: center; gap: 8px; }
    .slider-box input { flex: 1; accent-color: #ff9100; }
    .slider-val { font-size: 11px; width: 52px; text-align: right; color: #ff9100; }
    .shutter-row { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
    .gallery-preview {
      width: 48px; height: 48px; border-radius: 10px; background: #262626;
      border: 2px solid #444; overflow: hidden; cursor: pointer; position: relative;
      display: flex; justify-content: center; align-items: center; font-size: 10px; color: #888;
    }
    .gallery-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-count {
      position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.8);
      color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 4px;
    }
    .shutter-btn {
      width: 58px; height: 58px; border-radius: 50%; background: #fff;
      border: 4px solid #555; cursor: pointer;
    }
    .side-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: #262626; border: 1px solid #333; color: #fff; padding: 7px 9px;
      border-radius: 8px; font-size: 11px; cursor: pointer;
    }
    .icon-btn.active { border-color: #00e676; color: #00e676; }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 50; flex-direction: column; padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .modal-body img { max-width: 100%; max-height: 60vh; border-radius: 8px; }
    .thumb-strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; width: 100%; margin-top: 10px; }
    .thumb-strip img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; opacity: 0.6; }
    .thumb-strip img.selected { border: 2px solid #ff9100; opacity: 1; }
    .modal-actions { display: flex; gap: 12px; margin-top: 10px; }
    .btn-download { background: #00e676; color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; }
    .btn-delete { background: #ff5252; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="badge" id="resInfo">RES: -- | FPS: --</span>
    <span class="ai-status" id="aiStatus">AI: Siap</span>
    <div style="display:flex; gap:4px;">
      <button type="button" class="icon-btn active" id="gridBtn">Grid: ON</button>
      <button type="button" class="icon-btn" id="torchBtn">Torch: OFF</button>
    </div>
  </div>

  <div class="camera-container">
    <div class="start-box" id="startBox">
      <button type="button" class="start-btn" id="startCamBtn">📷 Ketuk untuk Aktifkan Kamera</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <div class="grid-overlay" id="gridOverlay"></div>
  </div>

  <div class="controls-wrapper">
    <div class="lut-header">
      <span>LUT: <strong id="activeLutName" style="color:#fff;">ASLI</strong></span>
      <div class="lut-actions">
        <button type="button" class="mini-btn" id="aiAutoLutBtn">✨ AI Auto-LUT</button>
        <button type="button" class="mini-btn" id="copyPresetBtn">📋 Salin Preset</button>
        <label class="mini-btn" for="cubeInput">+ Import .CUBE</label>
        <input type="file" id="cubeInput" accept=".cube" style="display:none;" />
      </div>
    </div>

    <div class="lut-scroll" id="lutList">
      <button type="button" class="lut-btn active" data-name="ASLI" data-filter="none">Asli</button>
      <button type="button" class="lut-btn" data-name="Canon G7X" data-filter="contrast(1.15) saturate(1.25) brightness(1.05)">Canon G7X</button>
      <button type="button" class="lut-btn" data-name="iPhone 14" data-filter="contrast(1.08) saturate(1.12) sepia(0.08)">iPhone 14</button>
      <button type="button" class="lut-btn" data-name="Warm Vintage" data-filter="sepia(0.35) contrast(1.1) brightness(0.95)">Warm Vintage</button>
      <button type="button" class="lut-btn" data-name="Teal & Orange" data-filter="contrast(1.25) saturate(1.3) hue-rotate(-12deg)">Teal & Orange</button>
      <button type="button" class="lut-btn" data-name="Cyberpunk" data-filter="contrast(1.4) saturate(1.6) hue-rotate(25deg)">Cyberpunk</button>
      <button type="button" class="lut-btn" data-name="B&W Noir" data-filter="grayscale(1) contrast(1.35)">B&W Noir</button>
    </div>

    <div class="manual-panel">
      <div class="manual-tabs">
        <button type="button" class="m-tab active" data-param="ev">EV<br><span id="lbl-ev">0.0</span></button>
        <button type="button" class="m-tab" data-param="iso">ISO<br><span id="lbl-iso">AUTO</span></button>
        <button type="button" class="m-tab" data-param="shutter">SHUTTER<br><span id="lbl-shutter">1/60</span></button>
        <button type="button" class="m-tab" data-param="wb">WB<br><span id="lbl-wb">5500K</span></button>
        <button type="button" class="m-tab" data-param="zoom">ZOOM<br><span id="lbl-zoom">1.0x</span></button>
      </div>
      <div class="slider-box">
        <input type="range" id="manualSlider" min="-2" max="2" step="0.1" value="0" />
        <span class="slider-val" id="sliderValueText">0.0 EV</span>
      </div>
    </div>

    <div class="shutter-row">
      <div class="gallery-preview" id="openGalleryBtn">
        <span id="emptyGalleryText">Foto</span>
        <img id="lastPhotoThumb" style="display:none;" alt="Preview" />
        <span class="photo-count" id="photoCount" style="display:none;">0</span>
      </div>
      <button type="button" class="shutter-btn" id="captureBtn"></button>
      <div class="side-actions">
        <button type="button" class="icon-btn" id="resetManualBtn">Reset</button>
        <button type="button" class="icon-btn" id="flipCamBtn">Flip Cam</button>
      </div>
    </div>
  </div>

  <div class="modal" id="galleryModal">
    <div class="modal-header">
      <h3>Galeri Foto (<span id="modalPhotoIndex">0/0</span>)</h3>
      <button type="button" class="icon-btn" id="closeGalleryBtn">✕ Tutup</button>
    </div>
    <div class="modal-body">
      <img id="modalMainImage" src="" alt="Hasil Foto" />
      <div class="modal-actions">
        <button type="button" class="btn-download" id="downloadPhotoBtn">⬇ Simpan Foto</button>
        <button type="button" class="btn-delete" id="deletePhotoBtn">🗑 Hapus</button>
      </div>
      <div class="thumb-strip" id="thumbStrip"></div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>
    <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var startBox = document.getElementById('startBox');
    var startCamBtn = document.getElementById('startCamBtn');
    var errorMsg = document.getElementById('errorMsg');
    var captureBtn = document.getElementById('captureBtn');
    var flipCamBtn = document.getElementById('flipCamBtn');
    var torchBtn = document.getElementById('torchBtn');
    var gridBtn = document.getElementById('gridBtn');
    var gridOverlay = document.getElementById('gridOverlay');
    var resInfo = document.getElementById('resInfo');
    var aiStatus = document.getElementById('aiStatus');
    var activeLutName = document.getElementById('activeLutName');

    var stream = null;
    var useFrontCam = false;
    var torchOn = false;
    var currentLutFilter = 'none';

    var manualState = { ev: 0, iso: 100, shutter: 60, wb: 5500, zoom: 1.0 };
    var activeParam = 'ev';
    var capturedPhotos = [];
    var selectedPhotoIndex = 0;

    function startCamera() {
      startCamBtn.textContent = '⏳ Membuka Kamera...';
      errorMsg.textContent = '';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        startCamBtn.textContent = '📷 Ketuk untuk Aktifkan Kamera';
        errorMsg.textContent = 'Browser tidak mendukung kamera.';
        return;
      }

      if (stream) {
        stream.getTracks().forEach(function(t) { t.stop(); });
        stream = null;
      }

      var facing = useFrontCam ? 'user' : 'environment';
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      }).then(function(mediaStream) {
        stream = mediaStream;
        video.srcObject = stream;
        video.play();
        startBox.style.display = 'none';
        resInfo.textContent = 'RES: HD | FPS: 30';
        aiStatus.textContent = 'AI: Scene Optimal';
      }).catch(function(err) {
        startCamBtn.textContent = '📷 Ketuk untuk Aktifkan Kamera';
        errorMsg.textContent = 'Error: ' + err.name + ' - ' + err.message;
      });
    }

    startCamBtn.onclick = startCamera;

    flipCamBtn.onclick = function() {
      useFrontCam = !useFrontCam;
      startCamera();
    };

    gridBtn.onclick = function() {
      gridOverlay.classList.toggle('hidden');
      var isOn = !gridOverlay.classList.contains('hidden');
      gridBtn.textContent = isOn ? 'Grid: ON' : 'Grid: OFF';
      gridBtn.classList.toggle('active', isOn);
    };

    torchBtn.onclick = function() {
      if (!stream) { alert('Aktifkan kamera dulu!'); return; }
      var track = stream.getVideoTracks().shift();
      if (track && track.getCapabilities && track.getCapabilities().torch) {
        torchOn = !torchOn;
        track.applyConstraints({ advanced: [{ torch: torchOn }] });
        torchBtn.textContent = torchOn ? 'Torch: ON' : 'Torch: OFF';
        torchBtn.classList.toggle('active', torchOn);
      } else {
        alert('Torch tidak didukung di browser ini.');
      }
    };

    function applyCameraEffects() {
      var brightnessVal = 1 + (manualState.ev * 0.25) + ((manualState.iso - 100) / 6000);
      var wbWarmth = (manualState.wb - 5500) / 10000;
      var sepiaAmt = wbWarmth > 0 ? Math.min(wbWarmth, 0.4) : 0;
      var hueAmt = wbWarmth < 0 ? wbWarmth * 40 : 0;

      var manualFilter = 'brightness(' + brightnessVal.toFixed(2) + ') sepia(' + sepiaAmt.toFixed(2) + ') hue-rotate(' + hueAmt.toFixed(0) + 'deg)';
      video.style.filter = currentLutFilter === 'none' ? manualFilter : (currentLutFilter + ' ' + manualFilter);
      video.style.transform = 'scale(' + manualState.zoom + ')';
    }

    function bindLutButtons() {
      var btns = document.querySelectorAll('.lut-btn');
      btns.forEach(function(btn) {
        btn.onclick = function() {
          btns.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentLutFilter = btn.getAttribute('data-filter');
          activeLutName.textContent = btn.getAttribute('data-name');
          applyCameraEffects();
        };
      });
    }
    bindLutButtons();

    document.getElementById('cubeInput').onchange = function(e) {
      var file = e.target.files.item(0);
      if (!file) return;
      var lutName = file.name.replace(/\.cube$/i, '').slice(0, 14);
      var newBtn = document.createElement('button');
      newBtn.type = 'button';
      newBtn.className = 'lut-btn';
      newBtn.setAttribute('data-name', lutName);
      newBtn.setAttribute('data-filter', 'contrast(1.2) saturate(1.25) sepia(0.12)');
      newBtn.textContent = lutName;
      document.getElementById('lutList').appendChild(newBtn);
      bindLutButtons();
      newBtn.click();
    };

    document.getElementById('aiAutoLutBtn').onclick = function() {
      aiStatus.textContent = 'AI: Menganalisis...';
      setTimeout(function() {
        var btns = document.querySelectorAll('.lut-btn');
        var idx = Math.floor(Math.random() * (btns.length - 1)) + 1;
        btns.item(idx).click();
        aiStatus.textContent = 'AI: ' + btns.item(idx).getAttribute('data-name');
      }, 500);
    };

    document.getElementById('copyPresetBtn').onclick = function() {
      var txt = 'Preset: ' + activeLutName.textContent + ' | EV:' + manualState.ev + ' | ISO:' + manualState.iso + ' | WB:' + manualState.wb + 'K';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt);
      }
      alert('Disalin:\n' + txt);
    };

    var slider = document.getElementById('manualSlider');
    var sliderValueText = document.getElementById('sliderValueText');
    var paramConfigs = {
      ev:      { min: -2,   max: 2,    step: 0.1, unit: ' EV', lbl: 'lbl-ev' },
      iso:     { min: 100,  max: 3200, step: 100, unit: '',    lbl: 'lbl-iso' },
      shutter: { min: 15,   max: 1000, step: 15,  unit: 's',   lbl: 'lbl-shutter' },
      wb:      { min: 2800, max: 8000, step: 100, unit: 'K',   lbl: 'lbl-wb' },
      zoom:    { min: 1,    max: 4,    step: 0.1, unit: 'x',   lbl: 'lbl-zoom' }
    };

    var tabs = document.querySelectorAll('.m-tab');
    tabs.forEach(function(tab) {
      tab.onclick = function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        activeParam = tab.getAttribute('data-param');
        var cfg = paramConfigs[activeParam];
        slider.min = cfg.min;
        slider.max = cfg.max;
        slider.step = cfg.step;
        slider.value = manualState[activeParam];
        sliderValueText.textContent = (activeParam === 'shutter' ? '1/' : '') + manualState[activeParam] + cfg.unit;
      };
    });

    slider.oninput = function() {
      var val = parseFloat(slider.value);
      manualState[activeParam] = val;
      var cfg = paramConfigs[activeParam];
      var text = (activeParam === 'shutter' ? '1/' : '') + val + cfg.unit;
      sliderValueText.textContent = text;
      document.getElementById(cfg.lbl).textContent = text.replace(' EV', '');
      applyCameraEffects();
    };

    document.getElementById('resetManualBtn').onclick = function() {
      manualState = { ev: 0, iso: 100, shutter: 60, wb: 5500, zoom: 1.0 };
      document.getElementById('lbl-ev').textContent = '0.0';
      document.getElementById('lbl-iso').textContent = 'AUTO';
      document.getElementById('lbl-shutter').textContent = '1/60';
      document.getElementById('lbl-wb').textContent = '5500K';
      document.getElementById('lbl-zoom').textContent = '1.0x';
      slider.value = manualState[activeParam];
      sliderValueText.textContent = manualState[activeParam] + paramConfigs[activeParam].unit;
      applyCameraEffects();
    };

    captureBtn.onclick = function() {
      if (!stream) {
        alert('Ketuk tombol "Ketuk untuk Aktifkan Kamera" terlebih dahulu!');
        return;
      }
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      var ctx = canvas.getContext('2d');
      ctx.filter = video.style.filter || 'none';

      var z = manualState.zoom;
      var sw = canvas.width / z;
      var sh = canvas.height / z;
      var sx = (canvas.width - sw) / 2;
      var sy = (canvas.height - sh) / 2;

      if (useFrontCam) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

      capturedPhotos.unshift(canvas.toDataURL('image/jpeg', 0.92));
      updateGalleryPreview();
    };

    function updateGalleryPreview() {
      var thumb = document.getElementById('lastPhotoThumb');
      var count = document.getElementById('photoCount');
      var emptyTxt = document.getElementById('emptyGalleryText');

      if (capturedPhotos.length > 0) {
        thumb.src = capturedPhotos.slice(0, 1).pop();
        thumb.style.display = 'block';
        count.textContent = capturedPhotos.length;
        count.style.display = 'block';
        emptyTxt.style.display = 'none';
      } else {
        thumb.style.display = 'none';
        count.style.display = 'none';
        emptyTxt.style.display = 'block';
      }
    }

    var galleryModal = document.getElementById('galleryModal');
    var modalMainImage = document.getElementById('modalMainImage');
    var thumbStrip = document.getElementById('thumbStrip');

    document.getElementById('openGalleryBtn').onclick = function() {
      if (capturedPhotos.length === 0) { alert('Belum ada foto.'); return; }
      selectedPhotoIndex = 0;
      renderModalGallery();
      galleryModal.classList.add('open');
    };

    document.getElementById('closeGalleryBtn').onclick = function() {
      galleryModal.classList.remove('open');
    };

    function renderModalGallery() {
      if (capturedPhotos.length === 0) {
        galleryModal.classList.remove('open');
        updateGalleryPreview();
        return;
      }
